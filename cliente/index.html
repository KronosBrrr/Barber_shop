<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barbearia — Área do Cliente</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===================== LOGIN ===================== -->
  <section class="tela tela-login" id="telaLogin">
    <div class="caixa-login">
      <div class="logo">✂</div>
      <h1>Barbearia</h1>
      <p class="sub">Entre para marcar seu horário e ver seus pedidos</p>

      <form id="formEntrar" class="form">
        <label>WhatsApp
          <input type="tel" id="entrarTel" required placeholder="(00) 00000-0000" autocomplete="tel">
        </label>
        <label>Senha
          <input type="password" id="entrarSenha" required placeholder="Sua senha" autocomplete="current-password">
        </label>
        <p class="erro" id="erroEntrar"></p>
        <button type="submit" class="btn-principal">Entrar</button>
        <p class="troca">Ainda não tem conta? <button type="button" class="link" id="irCriar">Criar conta</button></p>
      </form>

      <form id="formCriar" class="form" hidden>
        <label>Nome
          <input type="text" id="criarNome" required placeholder="Seu nome" autocomplete="name">
        </label>
        <label>WhatsApp
          <input type="tel" id="criarTel" required placeholder="(00) 00000-0000" autocomplete="tel">
        </label>
        <label>Senha
          <input type="password" id="criarSenha" required minlength="4" placeholder="Mínimo 4 caracteres" autocomplete="new-password">
        </label>
        <p class="erro" id="erroCriar"></p>
        <button type="submit" class="btn-principal">Criar conta</button>
        <p class="troca">Já tem conta? <button type="button" class="link" id="irEntrar">Entrar</button></p>
      </form>
    </div>
  </section>

  <!-- ===================== INÍCIO ===================== -->
  <section class="tela" id="telaInicio" hidden>
    <header class="topo">
      <div class="marca">✂ Barbearia</div>
      <button class="btn-sair" id="btnSair">Sair</button>
    </header>

    <main class="conteudo">
      <div class="boas-vindas">
        <span class="avatar grande" id="avatarUsuario"></span>
        <div>
          <p class="sub" id="saudacao"></p>
          <h1 id="nomeBoasVindas"></h1>
        </div>
      </div>

      <div id="proximoHorario"></div>

      <button class="btn-agendar" id="btnAgendar">
        <span class="icone">📅</span>
        <span>
          <strong>Realizar agendamento</strong>
          <small>Escolha serviço, barbeiro, horário e produtos</small>
        </span>
        <span class="seta">›</span>
      </button>

      <h2 class="titulo-secao">Seus pedidos anteriores</h2>
      <div id="historico"></div>
    </main>
  </section>

  <!-- ===================== AGENDAMENTO (passo a passo) ===================== -->
  <section class="tela" id="telaAgendar" hidden>
    <header class="topo">
      <button class="btn-voltar" id="btnFecharAgenda" aria-label="Voltar ao início">✕</button>
      <div class="marca">Novo agendamento</div>
      <span></span>
    </header>

    <div class="etapas" id="etapas"></div>

    <main class="conteudo">
      <div id="conteudoPasso"></div>
    </main>

    <footer class="rodape-agenda">
      <div class="total-parcial">
        <span class="sub">Total</span>
        <strong id="totalParcial">R$ 0,00</strong>
      </div>
      <button class="btn-secundario" id="btnAnterior">Voltar</button>
      <button class="btn-principal" id="btnProximo">Continuar</button>
    </footer>
  </section>

  <!-- ===================== SUCESSO ===================== -->
  <section class="tela tela-login" id="telaSucesso" hidden>
    <div class="caixa-login">
      <div class="logo ok">✓</div>
      <h1>Agendamento confirmado!</h1>
      <div id="detalheSucesso" class="detalhe-sucesso"></div>
      <button class="btn-principal" id="btnVoltarInicio">Voltar ao início</button>
    </div>
  </section>

  <div class="aviso" id="aviso"></div>

  <script src="comum.js"></script>
  <script src="dados.js"></script>
  <script src="app.js"></script>
</body>
</html>
